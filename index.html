<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#173B2E;
    --ink:#131311;
    --paper:#F5EFDD;
    --coral:#FF6A3D;
    --mustard:#F4B740;
    --sky:#7FC6C0;
    --line:#131311;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;overflow-x:hidden;}

  body{
    background:var(--bg);
    background-image:
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 16px 16px;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 18px 90px;
    min-height:100%;
  }

  .page{
    width:100%;
    max-width:440px;
  }

  /* header sticker */
  .header{
    background:var(--paper);
    border:3px solid var(--line);
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow: 7px 7px 0 var(--line);
    transform: rotate(-1.2deg);
    margin-bottom:34px;
    position:relative;
  }

  .badge{
    position:absolute;
    top:-14px;
    right:18px;
    background:var(--mustard);
    border:3px solid var(--line);
    border-radius:999px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:16px;
    padding:2px 14px 4px;
    transform: rotate(6deg);
  }

  .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    background: repeating-linear-gradient(45deg, var(--coral), var(--coral) 6px, var(--mustard) 6px, var(--mustard) 12px);
    border:3px solid var(--line);
    margin-bottom:14px;
  }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-size:30px;
    line-height:1;
    margin:0 0 8px;
    text-transform:uppercase;
    letter-spacing:-0.01em;
  }

  .tagline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
    margin:0;
    line-height:1.15;
  }

  /* folders */
  .folders{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .folder{
    background:var(--paper);
    border:3px solid var(--line);
    border-radius:12px;
    box-shadow: 6px 6px 0 var(--line);
    overflow:hidden;
    transform: rotate(var(--r, 0deg));
  }

  .folders > *:nth-child(1){ --r: -0.8deg; }
  .folders > *:nth-child(2){ --r: 0.7deg; }
  .folders > *:nth-child(3){ --r: -0.5deg; }

  .folder-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--head-color, var(--mustard));
    border:none;
    border-bottom:3px solid var(--line);
    padding:15px 18px;
    cursor:pointer;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:15px;
    color:var(--ink);
    text-align:left;
  }

  .folder:nth-of-type(1) .folder-head{ --head-color: var(--mustard); }
  .folder:nth-of-type(2) .folder-head{ --head-color: var(--sky); }
  .folder:nth-of-type(3) .folder-head{ --head-color: var(--coral); }

  .folder-arrow{
    flex:none;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:20px;
    transition: transform 0.2s ease;
  }

  .folder.open .folder-arrow{
    transform: rotate(180deg);
  }

  .folder-body{
    max-height:0;
    overflow:hidden;
    transition: max-height 0.28s ease;
  }

  .folder.open .folder-body{
    max-height:1000px;
  }

  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 18px;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1.5px dashed var(--line);
    font-size:14px;
    transition: background 0.12s ease, padding-left 0.12s ease;
  }

  .folder-body a.file-row:last-child{
    border-bottom:none;
  }

  .file-row:hover{
    background: var(--head-color, var(--mustard));
    padding-left:24px;
  }

  .file-dot{
    flex:none;
    font-family:'Caveat', cursive;
    font-weight:700;
    color:var(--ink);
    opacity:0.5;
  }

  .file-name{
    flex:1;
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
  }

  /* donation */
  .donate{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    background:var(--coral);
    color:var(--paper);
    border:3px solid var(--line);
    border-radius:999px;
    padding:16px 20px;
    margin-top:30px;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:15px;
    box-shadow: 6px 6px 0 var(--line);
    transform: rotate(-0.6deg);
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }

  .donate:hover{
    transform: rotate(0deg) translate(-2px,-2px);
    box-shadow: 8px 8px 0 var(--line);
  }

  .donate-emoji{
    font-family:'Caveat', cursive;
    font-size:20px;
  }

  /* pin gate */
  .lock-icon{
    font-family:'Caveat', cursive;
    font-size:16px;
    margin-left:6px;
  }

  .pin-gate{
    padding:20px 18px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-align:center;
  }

  .pin-gate p{
    margin:0;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:18px;
  }

  .pin-form{
    display:flex;
    gap:8px;
  }

  .pin-input{
    width:110px;
    text-align:center;
    letter-spacing:0.3em;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:10px 8px;
    border:3px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }

  .pin-input:focus{
    outline:none;
    background: var(--sky);
  }

  .pin-submit{
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:12px;
    background:var(--mustard);
    border:3px solid var(--line);
    border-radius:8px;
    padding:0 16px;
    cursor:pointer;
  }

  .pin-error{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    color:#B3261E;
    min-height:14px;
    margin:0;
  }

  /* footer */
  .footer{
    margin-top:40px;
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:18px;
    color:var(--paper);
  }

  /* shuffle button */
  .shuffle-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:28px;
  }

  .shuffle-btn{
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:0.02em;
    background:var(--mustard);
    color:var(--ink);
    border:3px solid var(--line);
    border-radius:999px;
    padding:12px 22px;
    cursor:pointer;
    box-shadow: 5px 5px 0 var(--line);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }

  .shuffle-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 7px 7px 0 var(--line);
  }

  .shuffle-btn:active{
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 var(--line);
  }

  .shuffle-icon{
    display:inline-block;
    transition: transform 0.4s ease;
  }

  .shuffle-btn.spin .shuffle-icon{
    transform: rotate(180deg);
  }

  @media (prefers-reduced-motion: reduce){
    .shuffle-btn, .shuffle-icon, .folder-body, .folder-arrow, .file-row, .donate{ transition:none; }
  }

  @media (max-width: 380px){
    body{ padding:40px 14px 70px; }
    .header{ padding:18px 18px 16px; }
    h1{ font-size:26px; }
    .tagline{ font-size:19px; }
    .folder-head{ padding:13px 14px; font-size:13px; }
    .file-row{ padding:12px 14px; font-size:13px; }
    .donate{ font-size:13px; padding:14px 16px; }
    .shuffle-btn{ font-size:12px; padding:10px 18px; }
  }

  @media (max-width: 300px){
    .pin-form{ flex-wrap:wrap; justify-content:center; }
    .pin-input{ width:100%; }
  }
</style>
</head>
<body>

  <div class="page">

    <div class="shuffle-wrap">
      <button class="shuffle-btn" id="shuffleBtn" type="button">
        <span class="shuffle-icon">✦</span> shuffle colors
      </button>
    </div>

    <div class="header">
      <span class="badge">online now</span>
      <div class="avatar"></div>
      <h1>All Tools</h1>
      <p class="tagline">every tool, tap to open ✦</p>
    </div>

    <div class="folders">

      <div class="folder open">
        <button class="folder-head" type="button">
          <span>Prompt Generator</span>
          <span class="folder-arrow">▾</span>
        </button>
        <div class="folder-body" id="promptGeneratorLinks"></div>
      </div>

      <div class="folder">
        <button class="folder-head" type="button">
          <span>Tools Generated</span>
          <span class="folder-arrow">▾</span>
        </button>
        <div class="folder-body" id="toolsGeneratedLinks"></div>
      </div>

      <div class="folder locked" id="contentBankFolder">
        <button class="folder-head" type="button">
          <span>Content Bank <span class="lock-icon">🔒</span></span>
          <span class="folder-arrow">▾</span>
        </button>
        <div class="folder-body">
          <div class="pin-gate" id="pinGate">
            <p>enter pin to unlock ✦</p>
            <form class="pin-form" id="pinForm">
              <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off">
              <button class="pin-submit" type="submit">Go</button>
            </form>
            <p class="pin-error" id="pinError"></p>
          </div>
          <div id="contentBankLinks" style="display:none;"></div>
        </div>
      </div>

    </div>

    <a class="donate" href="https://ko-fi.com/freetdy/goal?g=0" target="_blank" rel="noopener">
      <span class="donate-emoji">☕</span> buy me a coffee
    </a>

    <div class="footer">made with love, 2026</div>

  </div>

  <script>
    function escapeHtml(str){
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderLinks(containerId, items){
      var container = document.getElementById(containerId);
      if (!container || !items) return;
      container.innerHTML = items.map(function(it){
        return '<a class="file-row" href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener">' +
               '<span class="file-dot">✦</span><span class="file-name">' + escapeHtml(it.title) + '</span></a>';
      }).join('');
    }

    fetch('asset/data.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        renderLinks('promptGeneratorLinks', data.promptGenerator);
        renderLinks('toolsGeneratedLinks', data.toolsGenerated);
        renderLinks('contentBankLinks', data.contentBank);
      })
      .catch(function(err){
        console.error('Could not load asset/data.json', err);
      });

    var palettes = [
      { bg:'#173B2E', paper:'#F5EFDD', coral:'#FF6A3D', mustard:'#F4B740', sky:'#7FC6C0', line:'#131311' },
      { bg:'#2B1E3D', paper:'#F6EEDC', coral:'#F2545B', mustard:'#F2C14E', sky:'#8FB8DE', line:'#1A1226' },
      { bg:'#7A2E2E', paper:'#FBF1DE', coral:'#F2A65A', mustard:'#EFD9A7', sky:'#C6D8AF', line:'#241010' },
      { bg:'#123C5E', paper:'#F3EEE1', coral:'#EF7B45', mustard:'#F6C453', sky:'#9CD1D4', line:'#0A1F30' },
      { bg:'#3D2B1F', paper:'#F4EADC', coral:'#E4572E', mustard:'#D8A73D', sky:'#8FA998', line:'#1C1109' },
      { bg:'#1B4B43', paper:'#F7F0DD', coral:'#FF7A5C', mustard:'#FFC857', sky:'#A6D8D0', line:'#0E211D' },
      { bg:'#4A2545', paper:'#F5ECE1', coral:'#FF8C61', mustard:'#F9DB6D', sky:'#B8D8D8', line:'#20101D' },
      { bg:'#0F2E3D', paper:'#F2ECDD', coral:'#F45B69', mustard:'#F8CB2E', sky:'#7FB2A6', line:'#081A22' }
    ];

    var lastIndex = -1;
    var btn = document.getElementById('shuffleBtn');

    function applyPalette(p){
      var root = document.documentElement.style;
      root.setProperty('--bg', p.bg);
      root.setProperty('--paper', p.paper);
      root.setProperty('--coral', p.coral);
      root.setProperty('--mustard', p.mustard);
      root.setProperty('--sky', p.sky);
      root.setProperty('--line', p.line);
    }

    function shuffle(){
      var idx;
      do { idx = Math.floor(Math.random() * palettes.length); } while (idx === lastIndex);
      lastIndex = idx;
      applyPalette(palettes[idx]);

      btn.classList.add('spin');
      setTimeout(function(){ btn.classList.remove('spin'); }, 400);
    }

    btn.addEventListener('click', shuffle);

    var folderHeads = document.querySelectorAll('.folder-head');
    folderHeads.forEach(function(head){
      head.addEventListener('click', function(){
        head.closest('.folder').classList.toggle('open');
      });
    });

    var CONTENT_BANK_PIN = '55555';
    var pinForm = document.getElementById('pinForm');
    var pinInput = document.getElementById('pinInput');
    var pinError = document.getElementById('pinError');
    var pinGate = document.getElementById('pinGate');
    var contentBankLinks = document.getElementById('contentBankLinks');
    var contentBankFolder = document.getElementById('contentBankFolder');

    pinForm.addEventListener('submit', function(e){
      e.preventDefault();
      if (pinInput.value === CONTENT_BANK_PIN) {
        pinGate.style.display = 'none';
        contentBankLinks.style.display = 'block';
        contentBankFolder.classList.remove('locked');
        var lockIcon = contentBankFolder.querySelector('.lock-icon');
        if (lockIcon) lockIcon.textContent = '🔓';
      } else {
        pinError.textContent = 'wrong pin, try again';
        pinInput.value = '';
        pinInput.focus();
      }
    });
  </script>

</body>
</html>
